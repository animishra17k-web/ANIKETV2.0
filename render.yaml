services:
  - type: web
    name: ssc-cgl-ai-os
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_USERNAME
        value: student
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
